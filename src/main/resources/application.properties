# ==========================================
# Bilim Samsun - Depo Yönetim Sistemi
# ==========================================
# Bu dosya versiyon kontrolüne (git) GÜVENLİ olarak eklenebilir.
# Gerçek kimlik bilgileri application-local.properties içinde tutulur.
# ==========================================
spring.application.name=depo-yonetim

# ── Veritabanı (değerler application-local.properties'ten okunur) ──────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Sunucu ───────────────────────────────────────────────────────────────────
server.port=8080

# ── Harici ayar dosyası - env.properties'ten veritabanı bilgilerini yükler ────
# Bu sayede hassas bilgiler ayrı bir dosyada tutulur ve git'e eklenmez.
spring.config.import=optional:file:./env.properties

# ── JWT Ayarları ─────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ── Ollama AI Ayarları (Toplu Belge İçe Aktarımı) ──────────────────────────
ollama.base-url=http://localhost:11434
ollama.model=qwen2.5:3b
ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:120}
ollama.chunk-size-rows=${OLLAMA_CHUNK_SIZE_ROWS:10}
ollama.parallel-requests=${OLLAMA_PARALLEL_REQUESTS:2}
ollama.text-chunk-max-chars=${OLLAMA_TEXT_CHUNK_MAX_CHARS:12000}
ollama.pdf-text-chunk-max-chars=${OLLAMA_PDF_TEXT_CHUNK_MAX_CHARS:2000}
ollama.pdf-records-per-chunk=${OLLAMA_PDF_RECORDS_PER_CHUNK:5}
ollama.max-retries=${OLLAMA_MAX_RETRIES:2}
ollama.structured-output-enabled=${OLLAMA_STRUCTURED_OUTPUT_ENABLED:true}

# ── Otomatik MySQL Yedekleme ────────────────────────────────────────────────
# Windows örneği: C:/Program Files/MySQL/MySQL Server 8.4/bin/mysqldump.exe
database.backup.enabled=${DB_BACKUP_ENABLED:true}
database.backup.mysqldump-path=${MYSQLDUMP_PATH:mysqldump}
database.backup.jdbc-url=${spring.datasource.url}
database.backup.host=${DB_HOST:}
database.backup.port=${DB_PORT:0}
database.backup.username=${DB_USERNAME}
database.backup.password=${DB_PASSWORD}
database.backup.database-name=${DB_NAME:}
database.backup.ssl-mode=${DB_SSL_MODE:PREFERRED}
database.backup.directory=${DB_BACKUP_DIRECTORY:backups}
database.backup.retention-days=${DB_BACKUP_RETENTION_DAYS:14}
database.backup.process-timeout=${DB_BACKUP_PROCESS_TIMEOUT:30m}
database.backup.cron=${DB_BACKUP_CRON:0 0 3 * * *}
database.backup.zone=${DB_BACKUP_ZONE:Europe/Istanbul}
